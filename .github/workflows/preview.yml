# Plan morning-digest § 3 / § 4 (issues #7, #8). Saves /digest/2026-10-28 as one HTML file and
# deploys it to GitHub Pages. The preview is never committed (ADR 0003): it lives only in the
# Pages deployment and in a 1-day artifact. LANE_MARKER comes from the repo secret; delete the
# secret and run this again to publish the same page with "no marker set" over the same link.
name: preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g pnpm@12.18.0
      - run: pnpm install --frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PORT: 8787
        run: |
          pnpm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -fsS localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -o 'class="marker">[^<]*' _site/index.html | sed 's/class="marker">//' | grep -q . 
          grep -c '<tr' _site/index.html
          kill %1 || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
